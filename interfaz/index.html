<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plantilla administrativa moderna y modular" />
    <meta name="theme-color" content="#0f172a" />
    <title>Logy Admin</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('logy-theme')
        const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = savedTheme || systemTheme
        document.documentElement.style.setProperty('--menu-accent', localStorage.getItem('logy-menu-accent') || '#2563eb')
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
